#                              Z drive
#------------------------------------------------------------------------------------

#S5
[stepper_z]
step_pin: PG9
dir_pin: !PG10
enable_pin: !PG13
microsteps: 32
rotation_distance: 10
endstop_pin: probe:z_virtual_endstop
position_min: -20
position_max: 250
homing_speed: 5.0

[tmc5160 stepper_z]
cs_pin: PD2
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 0.4
sense_resistor: 0.075
stealthchop_threshold: 999999


# S6
[stepper_z1]
step_pin: PG11
dir_pin: !PD7
enable_pin: !PG12
microsteps: 32
rotation_distance: 10

[tmc5160 stepper_z1]
cs_pin: PA15
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 0.4
sense_resistor: 0.075
stealthchop_threshold: 999999


# S7
[stepper_z2]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB5
microsteps: 32
rotation_distance: 10

[tmc5160 stepper_z2]
cs_pin: PA9
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 0.4
sense_resistor: 0.075
stealthchop_threshold: 999999


# S8
[stepper_z3]
step_pin: PG15
dir_pin: !PB6
enable_pin: !PG14
microsteps: 32
rotation_distance: 10

[tmc5160 stepper_z3]
cs_pin: PA10
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 0.4
sense_resistor: 0.075
stealthchop_threshold: 999999


#                               Bed Compensation
#------------------------------------------------------------------------------------


[heater_bed]
heater_pin: PF5
sensor_pin: PB0 
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 10, 25    
mesh_max: 320, 330
probe_count: 8, 8
mesh_pps: 3, 3
#fade_start: 0.2
#fade_end: 0
zero_reference_position: 160, 160
adaptive_margin: 10
algorithm: bicubic
bicubic_tension: 0.5
move_check_distance: 5
split_delta_z: .01


[quad_gantry_level]
gantry_corners:
  -146, -135
  365, 345
points:
  0, 0
  0,  320
  320, 320
  320, 0

speed: 200
horizontal_move_z: 10
max_adjust: 10
retries: 5
retry_tolerance: 0.05

[screws_tilt_adjust]
screw1: 17, 16    
screw1_name: front left screw
screw2: 317, 16
screw2_name: front right screw
screw3: 317, 276
screw3_name: rear right screw
screw4: 17, 276
screw4_name: rear left screw
horizontal_move_z: 10
speed: 250  
screw_thread: CW-M4  




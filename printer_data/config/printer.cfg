#[include mmu/optional/client_macros.cfg]
#[include mmu/addons/mmu_erec_cutter.cfg]
#CAN bus (on PD0/PD1)".

# KlipperBackup token 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


[include macros.cfg]
[include mainsail.cfg]
[include canbus-ebb36.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes
[exclude_object]
[display_status]
[pause_resume]
[gcode_arcs]
resolution: 1.0


[mcu]
canbus_uuid: 6255bafbb8ad

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 800
max_z_velocity: 20
max_z_accel: 100

[input_shaper]
shaper_freq_x: 52.6
shaper_type_x: ei
shaper_freq_y: 34
shaper_type_y: zv


# S1
[stepper_x]
step_pin: PC14
dir_pin: !PC13
enable_pin: !PE6
microsteps: 32
rotation_distance: 39.9
endstop_pin: tmc5160_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: -15
position_min: -15
position_max: 320
homing_speed: 100

[tmc5160 stepper_x]
cs_pin: PD6
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
diag1_pin: !PC15
sense_resistor: 0.022
driver_SGT: 8  # -64 is most sensitive value, 63 is least sensitive
run_current: 1
hold_current: 0.25
stealthchop_threshold: 0


# S2
[stepper_y]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PE3
microsteps: 32
rotation_distance: 39.9
endstop_pin: tmc5160_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 372      
position_min: 0
position_max: 372
homing_speed: 100

[tmc5160 stepper_y]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
diag1_pin: !PF0
sense_resistor: 0.022
driver_SGT: 8  # -64 is most sensitive value, 63 is least sensitive
run_current: 1
hold_current: 0.25
stealthchop_threshold: 0



